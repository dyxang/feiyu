# ============================================================================
# DeepSeek Harness（dsh）一键部署
#
# 步骤（唯一必改：把 your-name 换成你的 GitHub 用户名）：
#   1. 把本仓库 push 到你的 GitHub，等 Actions 首次构建完成（绿勾）
#      → 镜像自动推送到 ghcr.io/<你的用户名>/dsh-harness:latest
#   2. NAS 上新建一个文件夹，把本文件命名为 docker-compose.yml 放进去
#   3. 把下面 image: 行里的 your-name 换成你的 GitHub 用户名
#      （或改为同目录建 .env 设 DSH_IMAGE，参考 .env.example）
#   4. docker compose up -d
#   5. 查看入口密码：cat data/dsh-home/INITIAL_PASSWORD.txt（或 docker logs dsh）
#   6. 浏览器打开 http://<NAS局域网IP>:8443，用户名 dsh
#   7. 首次进 Web UI：Settings → Models → Add a custom provider
#      接入你的本地 API 网关（OpenAI 兼容、Base URL 含 /v1；
#      文件方式参考仓库 examples/settings.yaml）
#
# 之后：CI 每周一自动重建镜像（底座安全补丁 + dsh 新版），
#      NAS 上 docker compose pull && docker compose up -d 即完成更新。
# 安全：入口三层 = 来源 IP 白名单（默认内网 + Tailscale 网段）→ basic auth
#      → dsh 只绑容器内 127.0.0.1；公网无端口映射。
# ============================================================================
services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/your-name/dsh-harness:latest} # ← 唯一必改：your-name
    container_name: dsh
    ports:
      - "8443:8443"     # 可写成 "<NAS局域网IP>:8443:8443" 只绑指定网卡
    environment:
      - CADDY_HASH=${CADDY_HASH:-}      # 不填 = 自动生成随机密码，写 data/dsh-home/INITIAL_PASSWORD.txt
      - ALLOWED_IPS=${ALLOWED_IPS:-}    # 不填 = 默认放行内网 + Tailscale 网段 + 回环
      - DSH_PORT=3080
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}  # 必填（外部访问时）：浏览器地址栏里的主机名/IP，空格分隔多个，见 README 排障
      - DSH_PUBLIC_URL=${DSH_PUBLIC_URL:-}        # 可选：对外访问根 URL，让启动日志直接打印可点开的带 token 地址
    # 可选：想自己定密码且不让它出现在 docker inspect / .env 里，用文件 secret（最安全的自定方式）：
    #   echo '你的密码' > ./data/dsh-password && chmod 600 ./data/dsh-password
    #   然后解开下一行注释，以及文件末尾的 secrets: 定义
    # secrets:
    #   - dsh_password
    volumes:
      - ./codespace:/data/workspace       # 代码持久化：dsh 工作区根目录（项目放这里）
      - ./data/dsh-home:/data/dsh-home    # 数据持久化：配置/凭据/INITIAL_PASSWORD.txt
      # 可选：缓存持久化（避免重建容器后重新下载依赖）
      # - ./data/go-cache:/root/go               # Go 模块缓存
      # - ./data/uv:/root/.local/share/uv        # uv 下载的 Python 版本
    restart: unless-stopped

# 解开上面 service 里 secrets: 注释时，这里也要一起解开：
# secrets:
#   dsh_password:
#     file: ./data/dsh-password
