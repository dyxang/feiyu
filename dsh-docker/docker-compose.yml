# DeepSeek Harness + Caddy
# Tailscale 不在本 compose 内（用你自己已有的容器）；Caddy 8443 发布到局域网，
# dsh web 只绑容器内 127.0.0.1，Caddy 是唯一入口（IP 白名单 + basic auth 双层）
services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/your-name/dsh-harness:latest}
    # build: .           # 本地构建时取消注释
    container_name: dsh
    ports:
      - "8443:8443"     # 可写成 "<NAS局域网IP>:8443:8443" 只绑指定网卡
    environment:
      - CADDY_HASH=${CADDY_HASH:?请在 .env 中设置 CADDY_HASH}
      - ALLOWED_IPS=${ALLOWED_IPS:-}
      - DSH_PORT=3080
    volumes:
      - ${DSH_WORKSPACE_PATH:-./workspace}:/data/workspace   # 项目代码（dsh 工作区根目录）
      - ${DSH_HOME_PATH:-./dsh-home}:/data/dsh-home          # settings.yaml / .credentials.yaml
    restart: unless-stopped
