# DeepSeek Harness + Caddy，纯 Tailscale 访问
# 访问入口：http://<tailnet-ip>:8443（仅 tailnet 内设备可达，无公网/局域网端口映射）
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: dsh-tailscale
    hostname: dsh-nas
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:?请在 .env 中设置 TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # - TS_EXTRA_ARGS=--advertise-exit-node   # 可选：让 NAS 兼做出口节点
    volumes:
      - ${TS_STATE_PATH:-./tailscale-state}:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    # 可选：取消注释后局域网设备也能经 http://NAS_IP:8443 直连（不再纯 tailnet）
    # ports:
    #   - "8443:8443"
    restart: unless-stopped

  dsh:
    image: ${DSH_IMAGE:-ghcr.io/your-name/dsh-harness:latest}
    # build: .          # 本地构建：docker compose build（需同时取消上一行 image 注释或保留均可）
    network_mode: "service:tailscale"   # 共享 tailscale 网络栈，8443 只存在于 tailnet IP 上
    container_name: dsh
    environment:
      - CADDY_HASH=${CADDY_HASH:?请在 .env 中设置 CADDY_HASH}
      - DSH_PORT=3080
    volumes:
      - ${DSH_WORKSPACE_PATH:-./workspace}:/data/workspace   # 项目代码（dsh 工作区根目录）
      - ${DSH_HOME_PATH:-./dsh-home}:/data/dsh-home          # settings.yaml / .credentials.yaml
    depends_on:
      - tailscale
    restart: unless-stopped
