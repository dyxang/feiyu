# DeepSeek Harness + Caddy
# Tailscale 不在本 compose 内（用你自己已有的容器）；Caddy 8443 发布到局域网，
# dsh web 只绑容器内 127.0.0.1，Caddy 是唯一入口（IP 白名单 + basic auth 双层）
services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/your-name/dsh-harness:latest}
    # build: .           # 本地构建时取消注释
    container_name: dsh
    ports:
      - "8443:8443"     # 可写成 "<NAS局域网IP>:8443:8443" 只绑指定网卡
    environment:
      - CADDY_HASH=${CADDY_HASH:?请在 .env 中设置 CADDY_HASH}
      - ALLOWED_IPS=${ALLOWED_IPS:-}
      - DSH_PORT=3080
    volumes:
      - ./codespace:/data/workspace       # 代码持久化：dsh 工作区根目录
      - ./data/dsh-home:/data/dsh-home    # 数据持久化：settings.yaml / .credentials.yaml
      # 可选：缓存持久化（避免重建容器后重新下载依赖）
      # - ./data/go-cache:/root/go               # Go 模块缓存
      # - ./data/uv:/root/.local/share/uv        # uv 下载的 Python 版本
    restart: unless-stopped
